backend:
  name: git-gateway
  branch: main   # ganti jadi "master" kalau nama branch default repo GitHub-mu itu

logo_url: "images/logo-ranahdesain.jpg"
site_url: "https://ranahdesain.store"
display_url: "https://ranahdesain.store"

media_folder: "images/portfolio-uploads"
public_folder: "images/portfolio-uploads"

collections:
  - name: "portfolio"
    label: "Portofolio"
    files:
      - name: "portfolio"
        label: "Daftar Karya Portofolio"
        file: "portfolio-data.json"
        fields:
          - label: "Daftar Karya"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - {label: "ID unik (huruf kecil, pakai tanda -, tanpa spasi)", name: "id", widget: "string"}
              - {label: "Judul Karya", name: "title", widget: "string"}
              - {label: "Nama Klien", name: "client", widget: "string"}
              - label: "Kategori (isi salah satu 'kode' dari menu Kelola Kategori di bawah, mis. branding)"
                name: "category"
                widget: "string"
                hint: "Harus persis sama dengan 'Kode Kategori' yang ada di menu Kelola Kategori (huruf kecil semua), supaya filter di halaman portofolio jalan."
              - {label: "Label Kategori (teks pendek yang tampil di badge kartu, mis. Branding)", name: "categoryLabel", widget: "string"}
              - {label: "Gambar", name: "image", widget: "image", required: false, hint: "Upload gambar karya di sini"}
              - {label: "Deskripsi (kenapa & bagaimana desain ini dibuat)", name: "description", widget: "text"}

  - name: "testimonials"
    label: "Testimoni Pelanggan"
    files:
      - name: "testimonials"
        label: "Daftar Testimoni"
        file: "testimonials-data.json"
        fields:
          - label: "Daftar Testimoni"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.business}}"
            fields:
              - {label: "ID unik (huruf kecil, pakai tanda -, tanpa spasi)", name: "id", widget: "string"}
              - {label: "Nama Pelanggan", name: "name", widget: "string"}
              - {label: "Bisnis / Jabatan", name: "business", widget: "string"}
              - {label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5}
              - {label: "Isi Testimoni", name: "quote", widget: "text"}
              - {label: "Foto Pelanggan (opsional)", name: "photo", widget: "image", required: false}

  - name: "homepage"
    label: "Halaman Utama (Bagian Depan)"
    files:
      - name: "homepage"
        label: "Konten Hero"
        file: "homepage-data.json"
        fields:
          - {label: "Badge kecil di atas judul", name: "badge", widget: "string"}
          - {label: "Judul - bagian sebelum kata yang di-highlight", name: "headline_before", widget: "string"}
          - {label: "Judul - kata yang di-highlight (garis bawah warna)", name: "headline_highlight", widget: "string"}
          - {label: "Judul - bagian setelah kata yang di-highlight", name: "headline_after", widget: "string"}
          - {label: "Paragraf deskripsi", name: "description", widget: "text"}
          - label: "Statistik (3 angka di bawah tombol)"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - {label: "Angka (mis. 213+ atau 1–3 hari)", name: "value", widget: "string"}
              - {label: "Keterangan angka", name: "label", widget: "string"}
          - label: "3 Kartu Ilustrasi di Sisi Kanan"
            name: "hero_images"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - {label: "Gambar (kosongkan untuk pakai ilustrasi default)", name: "image", widget: "image", required: false}
              - {label: "Keterangan kecil (nama file, mis. feed_ig_final.png)", name: "caption", widget: "string"}

  - name: "categories"
    label: "Kelola Kategori Portofolio"
    files:
      - name: "categories"
        label: "Daftar Kategori"
        file: "categories-data.json"
        fields:
          - label: "Daftar Kategori"
            name: "items"
            widget: "list"
            summary: "{{fields.label}} ({{fields.value}})"
            fields:
              - {label: "Kode Kategori (huruf kecil, tanpa spasi, mis. branding)", name: "value", widget: "string", hint: "Ini yang harus Anda ketik persis di field 'Kategori' waktu nambah item Portofolio."}
              - {label: "Nama yang Tampil (mis. Branding)", name: "label", widget: "string"}
